# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: diggerz-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
